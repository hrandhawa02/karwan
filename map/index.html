<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Karwan Map</title>
  <link rel="icon" href="/survey/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <link rel="stylesheet" href="/map/css/app.css">
</head>
<body class="map-app">
  <header class="map-header">
    <span class="brand">Karwan</span>
    <a class="nav-link" href="/">Home</a>
  </header>
  <main>
    <div class="search-wrap">
      <label class="search-label" for="search-input">Search</label>
      <input
        id="search-input"
        class="search-input"
        type="search"
        enterkeyhint="search"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Trail, lot, peak, or 47.49, -121.72"
      >
      <div id="search-suggest" class="search-suggest" hidden></div>
    </div>
    <div id="map-filters" class="map-filters" aria-label="Place kinds"></div>
    <p id="map-status" class="map-status" role="status" hidden></p>
    <div id="map" class="map-frame" aria-label="Map"></div>
    <aside id="place-sheet" class="place-sheet" hidden></aside>
    <p id="map-attrib" class="map-attrib"></p>
  </main>
  <script type="module" src="/map/js/main.js"></script>
</body>
</html>
